name: Mirror school site to docs

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours (UTC)
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: mirror-docs
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mirror site with wget
        run: |
          set -euo pipefail
          # Fetch ONLY the target page plus its assets (CSS/JS/images).
          # No -r/--mirror: recursion would crawl the whole index.php/ tree
          # because --no-parent only blocks links ABOVE the start URL, not siblings.
          mkdir -p docs
          wget \
            --page-requisites \
            --adjust-extension \
            --convert-links \
            --timestamping \
            --no-parent \
            --exclude-directories=/autosch/joomla15/administrator \
            --reject-regex='[?]format=feed' \
            --execute robots=off \
            --no-host-directories \
            --cut-dirs=2 \
            --timeout=30 \
            --tries=3 \
            --wait=1 \
            --random-wait \
            --user-agent="Mozilla/5.0 (github-mirror; every-3h; +https://github.com/kkapelon/5o-dimotiko-chalandriou)" \
            --directory-prefix=docs \
            http://5dim-chalandr.att.sch.gr/autosch/joomla15/index.php/nea-anakoinoseis
          # Disable Jekyll processing so Joomla assets (e.g. _files) are served as-is
          touch docs/.nojekyll
          # Sanity check: need at least the nea-anakoinoseis page
          test -f docs/index.php/nea-anakoinoseis.html || { echo "ERROR: docs/index.php/nea-anakoinoseis.html not found after mirror"; exit 1; }

      - name: Auto-commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "mirror: automatic update from http://5dim-chalandr.att.sch.gr/autosch/joomla15/"
          file_pattern: docs
          repository: ${{ github.repository }}
