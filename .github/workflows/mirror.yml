name: Mirror school site to docs

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours (UTC)
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: mirror-docs
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mirror site with wget
        run: |
          set -euo pipefail
          # Keep the previous mirror in docs/ so wget only re-downloads changed
          # pages/assets (wget --mirror implies --timestamping). Do NOT wipe docs,
          # otherwise every run is a full re-crawl.
          mkdir -p docs
          wget \
            --mirror \
            --timestamping \
            --page-requisites \
            --adjust-extension \
            --convert-links \
            --no-parent \
            --exclude-directories=/autosch/joomla15/administrator \
            --execute robots=off \
            --no-host-directories \
            --cut-dirs=2 \
            --timeout=30 \
            --tries=3 \
            --wait=1 \
            --random-wait \
            --user-agent="Mozilla/5.0 (github-mirror; every-3h; +https://github.com/kkapelon/5o-dimotiko-chalandriou)" \
            --directory-prefix=docs \
            http://5dim-chalandr.att.sch.gr/autosch/joomla15/
          # Disable Jekyll processing so Joomla assets (e.g. _files) are served as-is
          touch docs/.nojekyll
          # Sanity check: Pages needs docs/index.html
          ls -la docs | head -n 30
          test -f docs/index.html || { echo "ERROR: docs/index.html not found after mirror"; exit 1; }

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "mirror: $(date -u +%Y-%m-%dT%H:%MZ) from http://5dim-chalandr.att.sch.gr/autosch/joomla15/"
          git push
