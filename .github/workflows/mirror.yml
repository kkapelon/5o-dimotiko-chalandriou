name: Mirror school site to docs

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours (UTC)
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: mirror-docs
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mirror site with wget
        run: |
          set -euo pipefail
          # Mirror ONLY the nea-anakoinoseis subtree (listing + sub-articles).
          # The trailing slash makes wget's parent dir index.php/nea-anakoinoseis/,
          # so --no-parent confines recursion to it and excludes sibling menus
          # (to-sxoleio-mas, drastiriotites, ...). --page-requisites still pulls
          # the CSS/JS/images that live outside that subtree.
          mkdir -p docs
          # wget exits 8 when any request gets a server error response (e.g. a
          # CSS-referenced image that 404s upstream). That is not fatal for a
          # mirror, so tolerate 8 and fail on any other non-zero code. The
          # sanity check below guards against a genuinely empty/failed mirror.
          set +e
          wget \
            --recursive \
            --level=inf \
            --timestamping \
            --page-requisites \
            --adjust-extension \
            --convert-links \
            --no-parent \
            --reject-regex='[?]format=feed' \
            --execute robots=off \
            --no-host-directories \
            --cut-dirs=2 \
            --timeout=30 \
            --tries=3 \
            --wait=1 \
            --random-wait \
            --user-agent="Mozilla/5.0 (github-mirror; every-3h; +https://github.com/kkapelon/5o-dimotiko-chalandriou)" \
            --directory-prefix=docs \
            http://5dim-chalandr.att.sch.gr/autosch/joomla15/index.php/nea-anakoinoseis/
          wget_status=$?
          set -e
          if [ "$wget_status" -ne 0 ] && [ "$wget_status" -ne 8 ]; then
            echo "wget failed with exit code $wget_status"
            exit "$wget_status"
          fi
          # Disable Jekyll processing so Joomla assets (e.g. _files) are served as-is
          touch docs/.nojekyll
          # Sanity check: the listing page must exist
          test -f docs/index.php/nea-anakoinoseis/index.html || { echo "ERROR: docs/index.php/nea-anakoinoseis/index.html not found after mirror"; exit 1; }

      - name: Auto-commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "mirror: automatic update from http://5dim-chalandr.att.sch.gr/autosch/joomla15/"
          file_pattern: docs
